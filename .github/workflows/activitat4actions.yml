# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Integració contínua sobre el projecte funcions

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Configurar Python 3.10  
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Instal·lar dependències  # Instal·lar les dependències necessàries
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint amb pylint  # Realitzar l'anàlisi de codi amb pylint
      run: |
        # Atura el procés si hi ha errors de sintaxi o noms no definits
        pylint --fail-under=1 src  # Configurat per fallar si la puntuació és inferior a 10
    - name: Proves amb pytest  # Executar les proves amb pytest
      run: |
        pytest
